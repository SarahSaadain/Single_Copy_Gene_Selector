# config.yaml - Configuration file for aDNA pipeline

# Mapping settings (optional — defaults shown)
mapping:
  mapper: minimap2  # minimap2 (default) or bwa-mem2

species:
  demo:
    name: demo
    lineage: drosophilidae_odb12
    settings:
      num_top_scgs: 20
      min_length_scg: 4000
      max_length_scg: 8000
    reads:
      - /demo_data/demo.fastq.gz
    reference: /demo_data/Dfun_reference_genome.fasta